<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24251f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Osprey Armies">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Osprey Army Builder</title>
  <style>
    :root{--bg:#171813;--panel:#292b23;--panel2:#35382d;--ink:#f3ecd9;--muted:#c8bea5;--gold:#c89a47;--red:#bc594d;--green:#77985d;--line:#585d4d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#1d1f19,#10110e);color:var(--ink);font-family:Georgia,serif;padding:max(12px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom))}main{max-width:920px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:start}h1{margin:0;font-size:clamp(1.7rem,7vw,2.8rem)}h2{margin:0 0 10px}p.sub{color:var(--muted);margin:4px 0 14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0006}label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#11130f;color:var(--ink)}textarea{min-height:76px;resize:vertical}button{border:1px solid var(--line);border-radius:11px;background:#3b3e33;color:var(--ink);padding:11px;touch-action:manipulation}.primary{background:var(--gold);color:#21180d;border:0;font-weight:bold}.success{background:var(--green);color:#10170d;border:0;font-weight:bold}.danger{border-color:var(--red);color:#f4b4ad;background:transparent}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.box,.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}.box b,.stat b{display:block;font-size:1.35rem}.box span,.stat span{font-size:.72rem;color:var(--muted)}.unithead{display:flex;justify-content:space-between;gap:10px}.unithead h3{margin:0;font-size:1.18rem}.meta{color:var(--muted);font-size:.83rem;margin:5px 0 10px}.badge{font-size:.72rem;padding:5px 8px;border-radius:99px;background:#334735;white-space:nowrap}.badge.half{background:#57461f}.badge.bad{background:#5a2b26}.badge.good{background:#314d32}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:26px}.builder{display:grid;grid-template-columns:1fr 1fr;gap:10px}.catalog{display:grid;gap:8px}.catalog button{text-align:left}.catalog small{display:block;color:var(--muted);margin-top:3px}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#11130f;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.75rem;padding:4px 8px}dialog{width:min(94vw,640px);border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#000b}.modal{padding:16px}.counter{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0}.round{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#21180d;border:0;font-size:2rem;font-weight:bold}.num{min-width:100px;text-align:center;font-size:3rem;background:#11130f;border:1px solid var(--line);border-radius:14px;padding:8px}.small{font-size:.79rem;color:var(--muted);line-height:1.4}.hidden{display:none!important}@media(max-width:680px){.summary{grid-template-columns:1fr 1fr}.toolbar,.builder{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Osprey Army Builder</h1><p class="sub">Build, save, and track forces for Osprey wargames on iOS.</p></div><button id="install" hidden>Install</button></header>
  <section class="card">
    <div class="grid3"><div><label for="game">Game profile</label><select id="game"></select></div><div><label for="force">Force name</label><input id="force" value="New Force"></div><div><label for="limit">Points limit</label><input id="limit" type="number" min="0" value="24"></div></div>
    <div class="summary"><div class="box"><b id="units">0</b><span>Units</span></div><div class="box"><b id="points">0</b><span>Points</span></div><div class="box"><b id="remainingPts">24</b><span>Pts Left</span></div><div class="box"><b id="remaining">0</b><span>Models/SP</span></div><div class="box"><b id="lost">0</b><span>Lost</span></div></div>
  </section>
  <section class="card builder"><div><h2>Army builder</h2><label for="catalog">Unit catalogue</label><div id="catalog" class="catalog"></div></div><div><h2>Roster notes</h2><textarea id="notes" placeholder="Scenario, leader traits, upgrades, reminders..."></textarea><p class="small" id="profileNote"></p><button class="primary" id="add" style="width:100%">+ Custom Unit</button></div></section>
  <div class="toolbar"><button id="sample">Load Sample</button><button id="export">Export</button><button id="import">Import</button><button id="share">Share</button><input id="file" type="file" accept=".json" hidden></div>
  <section id="list"></section><section id="empty" class="card empty">No units yet. Add units from the catalogue or create a custom entry.</section>
  <div class="grid2"><button id="reset">Reset Damage</button><button class="danger" id="clear">Delete All</button></div>
</main>
<dialog id="unitDlg"><form class="modal" id="unitForm"><h2 id="unitTitle">Add Unit</h2><div class="grid2"><div><label>Name</label><input id="name" required></div><div><label>Type / role</label><input id="type"></div><div><label id="startLabel">Starting strength/models</label><input id="start" type="number" min="1" value="12"></div><div><label id="defLabel">Armour / Stamina</label><input id="def" type="number" min="1" value="3"></div><div><label>Points</label><input id="pts" type="number" min="0" value="4"></div><div><label>Courage / Morale</label><input id="morale" type="number" min="0" value="4"></div></div><label>Upgrades / notes</label><textarea id="unitNotes"></textarea><div class="grid2"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="damageDlg"><div class="modal"><h2 id="damageTitle">Apply Damage</h2><div class="grid2"><div><label id="damageDefLabel">Current Armour / Stamina</label><input id="currentDef" type="number" min="1"></div><div><label>Temporary modifier</label><input id="mod" type="number" value="0"></div></div><div class="counter"><button class="round" id="minus">−</button><div class="num" id="hits">0</div><button class="round" id="plus">+</button></div><p class="small" id="preview" style="text-align:center"></p><button class="primary" id="applyDamage" style="width:100%">Apply</button><div class="grid2" style="margin-top:9px"><button id="undo">Undo Last</button><button id="done">Done</button></div></div></dialog>
<script>
const profiles={dr1:{name:'Dragon Rampant — 1st Edition',term:'Strength Points',def:'Armour',half:true,limit:24,note:'Unofficial aid: choose troop types, add upgrades in notes, then track Strength Point losses during play.',catalog:[['Elite Riders',6,4,6,4],['Heavy Riders',6,3,4,4],['Light Riders',6,2,4,4],['Elite Foot',6,4,6,4],['Heavy Foot',12,3,4,4],['Light Foot',12,2,3,4],['Bellicose Foot',12,3,4,4],['Light Missiles',12,2,4,4],['Heavy Missiles',12,3,4,4],['Lesser Warbeast',6,3,4,4],['Greater Warbeast',6,4,6,4]]},dr2:{name:'Dragon Rampant — 2nd Edition',term:'Strength Points',def:'Armour',half:true,limit:24,note:'Use the roster notes for reduced model units, fantastical rules, leader traits, and scenario details.',catalog:[['Elite Riders',6,4,6,4],['Heavy Riders',6,3,4,4],['Light Riders',6,2,4,4],['Elite Foot',6,4,6,4],['Heavy Foot',12,3,4,4],['Light Foot',12,2,3,4],['Bellicose Foot',12,3,4,4],['Light Missiles',12,2,4,4],['Heavy Missiles',12,3,4,4],['Lesser Warbeast',6,3,4,4],['Greater Warbeast',6,4,6,4]]},pl:{name:"The Pikeman's Lament",term:'Models',def:'Stamina',half:true,limit:24,note:'Use notes for officer traits and company special rules; casualties are tracked by model count.',catalog:[['Raw Pike',12,2,3,4],['Drilled Pike',12,2,4,4],['Veteran Pike',12,2,5,4],['Raw Shot',12,2,3,4],['Drilled Shot',12,2,4,4],['Commanded Shot',6,2,2,4],['Forlorn Hope',6,2,4,4],['Gallopers',6,2,4,4],['Trotters',6,2,4,4],['Dragoons',6,2,4,4]]},generic:{name:'Custom / Other Osprey Game',term:'Strength',def:'Defence divisor',half:false,limit:0,note:'Custom profile for other Osprey games. Catalogue entries are starting points; edit freely.',catalog:[['Infantry',10,3,4,4],['Skirmishers',8,2,3,4],['Cavalry',6,3,4,4],['Monster or Vehicle',4,4,6,4]]}};
let state={game:'dr1',force:'New Force',limit:24,notes:'',units:[]},editId=null,activeId=null,hitCount=0,promptEvent=null;const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rem(u){return Math.max(0,u.start-u.lost)}function prof(){return profiles[state.game]||profiles.generic}function save(){state.game=$('game').value;state.force=$('force').value||'New Force';state.limit=+$('limit').value||0;state.notes=$('notes').value;localStorage.setItem('ospreyBuilderV2',JSON.stringify(state))}function load(){try{const d=JSON.parse(localStorage.getItem('ospreyBuilderV2')||localStorage.getItem('ospreyTrackerV1'));if(d&&d.units)state={limit:profiles[d.game]?.limit||24,notes:'',...d}}catch(e){}Object.keys(profiles).forEach(k=>$('game').append(new Option(profiles[k].name,k)));$('game').value=state.game;$('force').value=state.force;$('limit').value=state.limit;$('notes').value=state.notes||''}function status(u){if(rem(u)<=0)return['Destroyed','bad'];if(u.battered)return['Battered','bad'];if(prof().half&&rem(u)<=u.start/2)return['Half strength','half'];return['Ready','good']}function dice(u){if(!prof().half)return'—';if(rem(u)<=0)return 0;return rem(u)<=u.start/2?6:12}function makeUnit(x){return{id:uid(),name:x[0],type:'Catalogue Unit',start:x[1],def:x[2],pts:x[3],morale:x[4],notes:'',lost:0,battered:false,history:[]}}function renderCatalog(){const c=$('catalog');c.innerHTML='';prof().catalog.forEach(x=>{const b=document.createElement('button');b.innerHTML=`<b>+ ${esc(x[0])}</b><small>${x[1]} ${prof().term} · ${prof().def} ${x[2]} · ${x[3]} pts</small>`;b.onclick=()=>{state.units.push(makeUnit(x));render()};c.appendChild(b)})}function render(){const l=$('list');l.innerHTML='';let tr=0,tl=0,tp=0;state.units.forEach(u=>{tr+=rem(u);tl+=u.lost;tp+=u.pts;const s=status(u),a=document.createElement('article');a.className='card';a.innerHTML=`<div class="unithead"><div><h3>${esc(u.name)}</h3><div class="meta">${esc(u.type||'Unit')} · ${prof().def} ${u.def} · Morale ${u.morale} · ${u.pts} pts</div></div><span class="badge ${s[1]}">${s[0]}</span></div><div class="grid3"><div class="stat"><b>${rem(u)}/${u.start}</b><span>${prof().term}</span></div><div class="stat"><b>${u.lost}</b><span>Lost</span></div><div class="stat"><b>${dice(u)}</b><span>Combat Dice</span></div></div>${u.notes?`<p class="small">${esc(u.notes)}</p>`:''}<div class="actions"><button class="primary damage" data-id="${u.id}">Damage</button><button class="edit" data-id="${u.id}">Edit</button><button class="battered" data-id="${u.id}">${u.battered?'Clear Battered':'Mark Battered'}</button><button class="danger delete" data-id="${u.id}">Delete</button></div>`;l.appendChild(a)});$('units').textContent=state.units.length;$('remaining').textContent=tr;$('lost').textContent=tl;$('points').textContent=tp;$('remainingPts').textContent=state.limit?state.limit-tp:'—';$('remainingPts').style.color=state.limit&&tp>state.limit?'#f4b4ad':'';$('empty').classList.toggle('hidden',state.units.length>0);$('profileNote').textContent=prof().note;save()}function updateLabels(){renderCatalog();$('startLabel').textContent='Starting '+prof().term;$('defLabel').textContent=prof().def;$('damageDefLabel').textContent='Current '+prof().def;$('profileNote').textContent=prof().note}function openUnit(u){editId=u?.id||null;$('unitTitle').textContent=u?'Edit Unit':'Add Custom Unit';$('name').value=u?.name||'';$('type').value=u?.type||'';$('start').value=u?.start||12;$('def').value=u?.def||(state.game==='pl'?2:3);$('pts').value=u?.pts??4;$('morale').value=u?.morale??4;$('unitNotes').value=u?.notes||'';updateLabels();$('unitDlg').showModal()}function openDamage(id){activeId=id;hitCount=0;const u=state.units.find(x=>x.id===id);$('damageTitle').textContent=u.name;$('currentDef').value=u.def;$('mod').value=0;$('damageDlg').showModal();renderDamage()}function renderDamage(){const u=state.units.find(x=>x.id===activeId),d=Math.max(1,(+$('currentDef').value||1)+(+$('mod').value||0)),loss=Math.min(rem(u),Math.floor(hitCount/d));$('hits').textContent=hitCount;$('preview').textContent=`${hitCount} hits ÷ ${prof().def} ${d} = ${loss} ${prof().term} lost`;$('undo').disabled=!u.history.length}function rosterText(){return `${state.force} (${prof().name})\n${state.units.reduce((n,u)=>n+u.pts,0)}/${state.limit||'∞'} pts\n`+state.units.map(u=>`- ${u.name}: ${u.pts} pts, ${rem(u)}/${u.start} ${prof().term}`).join('\n')}
$('game').onchange=()=>{state.game=$('game').value;state.limit=state.limit||prof().limit;$('limit').value=state.limit;updateLabels();render()};$('force').oninput=save;$('limit').oninput=render;$('notes').oninput=save;$('add').onclick=()=>openUnit();$('cancel').onclick=()=>$('unitDlg').close();$('unitForm').onsubmit=e=>{e.preventDefault();const data={name:$('name').value.trim(),type:$('type').value.trim(),start:+$('start').value||12,def:+$('def').value||1,pts:+$('pts').value||0,morale:+$('morale').value||0,notes:$('unitNotes').value.trim()};if(editId){const u=state.units.find(x=>x.id===editId);Object.assign(u,data);u.lost=Math.min(u.lost,u.start)}else state.units.push({id:uid(),...data,lost:0,battered:false,history:[]});$('unitDlg').close();render()};$('list').onclick=e=>{const id=e.target.dataset.id;if(!id)return;const u=state.units.find(x=>x.id===id);if(e.target.classList.contains('damage'))openDamage(id);if(e.target.classList.contains('edit'))openUnit(u);if(e.target.classList.contains('battered')){u.battered=!u.battered;render()}if(e.target.classList.contains('delete')&&confirm('Delete '+u.name+'?')){state.units=state.units.filter(x=>x.id!==id);render()}};$('plus').onclick=()=>{hitCount++;renderDamage()};$('minus').onclick=()=>{hitCount=Math.max(0,hitCount-1);renderDamage()};$('currentDef').oninput=renderDamage;$('mod').oninput=renderDamage;$('applyDamage').onclick=()=>{const u=state.units.find(x=>x.id===activeId),d=Math.max(1,(+$('currentDef').value||1)+(+$('mod').value||0)),loss=Math.min(rem(u),Math.floor(hitCount/d));u.lost+=loss;u.history.push({hits:hitCount,def:d,loss});hitCount=0;render();renderDamage()};$('undo').onclick=()=>{const u=state.units.find(x=>x.id===activeId);if(u.history.length){const h=u.history.pop();u.lost=Math.max(0,u.lost-h.loss);render();renderDamage()}};$('done').onclick=()=>$('damageDlg').close();$('sample').onclick=()=>{if(state.units.length&&!confirm('Replace current force?'))return;state.units=prof().catalog.slice(0,4).map(makeUnit);render()};$('export').onclick=()=>{save();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='osprey_army.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.units)throw 0;state={limit:profiles[d.game]?.limit||24,notes:'',...d};$('game').value=state.game;$('force').value=state.force;$('limit').value=state.limit;$('notes').value=state.notes||'';updateLabels();render()}catch{alert('Invalid export file')}};if(e.target.files[0])r.readAsText(e.target.files[0])};$('share').onclick=async()=>{save();const text=rosterText();if(navigator.share)await navigator.share({title:state.force,text});else{await navigator.clipboard.writeText(text);alert('Roster copied to clipboard')}};$('reset').onclick=()=>{if(confirm('Reset all damage?')){state.units.forEach(u=>{u.lost=0;u.battered=false;u.history=[]});render()}};$('clear').onclick=()=>{if(confirm('Delete all units?')){state.units=[];render()}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;$('install').hidden=true}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));load();updateLabels();render();
</script>
</body>
</html>
