<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24251f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Battle Tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Osprey Battle Tracker</title><style>
:root{--bg:#171813;--panel:#292b23;--panel2:#35382d;--ink:#f3ecd9;--muted:#c8bea5;--gold:#c89a47;--red:#bc594d;--line:#585d4d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#1d1f19,#10110e);color:var(--ink);font-family:Georgia,serif;padding:max(12px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom))}main{max-width:820px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:start}h1{margin:0;font-size:clamp(1.7rem,7vw,2.6rem)}p.sub{color:var(--muted);margin:4px 0 14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0006}label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#11130f;color:var(--ink)}button{border:1px solid var(--line);border-radius:11px;background:#3b3e33;color:var(--ink);padding:11px;touch-action:manipulation}.primary{background:var(--gold);color:#21180d;border:0;font-weight:bold}.danger{border-color:var(--red);color:#f4b4ad;background:transparent}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.box,.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px;text-align:center}.box b,.stat b{display:block;font-size:1.35rem}.box span,.stat span{font-size:.72rem;color:var(--muted)}.unithead{display:flex;justify-content:space-between;gap:10px}.unithead h2{margin:0;font-size:1.18rem}.meta{color:var(--muted);font-size:.83rem;margin:5px 0 10px}.badge{font-size:.72rem;padding:5px 8px;border-radius:99px;background:#334735;white-space:nowrap}.badge.half{background:#57461f}.badge.bad{background:#5a2b26}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:26px}dialog{width:min(94vw,620px);border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#000b}.modal{padding:16px}.modal h2{margin-top:0}.counter{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0}.round{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#21180d;border:0;font-size:2rem;font-weight:bold}.num{min-width:100px;text-align:center;font-size:3rem;background:#11130f;border:1px solid var(--line);border-radius:14px;padding:8px}.small{font-size:.79rem;color:var(--muted);line-height:1.4}.hidden{display:none!important}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}}
</style></head><body><main><header><div><h1>Osprey Battle Tracker</h1><p class="sub">Multi-game, offline unit and casualty tracker</p></div><button id="install" hidden>Install</button></header><section class="card"><label for="game">Game profile</label><select id="game"><option value="dr1">Dragon Rampant — 1st Edition</option><option value="dr2">Dragon Rampant — 2nd Edition</option><option value="pl">The Pikeman's Lament</option><option value="generic">Custom / Other Osprey Game</option></select><div class="grid2" style="margin-top:10px"><div><label for="force">Force name</label><input id="force" value="New Force"></div><div style="align-self:end"><button class="primary" id="add" style="width:100%">+ Add Unit</button></div></div><div class="summary"><div class="box"><b id="units">0</b><span>Units</span></div><div class="box"><b id="remaining">0</b><span>Remaining</span></div><div class="box"><b id="lost">0</b><span>Lost</span></div><div class="box"><b id="points">0</b><span>Points Active</span></div></div></section><div class="toolbar"><button id="sample">Load Sample</button><button id="export">Export</button><button id="import">Import</button><input id="file" type="file" accept=".json" hidden></div><section id="list"></section><section id="empty" class="card empty">No units yet.</section><div class="grid2"><button id="reset">Reset Damage</button><button class="danger" id="clear">Delete All</button></div></main><dialog id="unitDlg"><form class="modal" id="unitForm"><h2 id="unitTitle">Add Unit</h2><div class="grid2"><div><label>Name</label><input id="name" required></div><div><label>Type / notes</label><input id="type"></div><div><label>Starting strength/models</label><input id="start" type="number" min="1" value="12"></div><div><label id="defLabel">Armour / Stamina</label><input id="def" type="number" min="1" value="3"></div><div><label>Points</label><input id="pts" type="number" min="0" value="4"></div><div><label>Courage / Morale</label><input id="morale" type="number" min="0" value="4"></div></div><p class="small" id="profileNote"></p><div class="grid2"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><dialog id="damageDlg"><div class="modal"><h2 id="damageTitle">Apply Damage</h2><div class="grid2"><div><label id="damageDefLabel">Current Armour / Stamina</label><input id="currentDef" type="number" min="1"></div><div><label>Temporary modifier</label><input id="mod" type="number" value="0"></div></div><div class="counter"><button class="round" id="minus">−</button><div class="num" id="hits">0</div><button class="round" id="plus">+</button></div><p class="small" id="preview" style="text-align:center"></p><button class="primary" id="applyDamage" style="width:100%">Apply</button><div class="grid2" style="margin-top:9px"><button id="undo">Undo Last</button><button id="done">Done</button></div></div></dialog><script>
const profiles={dr1:{term:'Strength Points',def:'Armour',half:true,note:'Loss = whole hits divided by Armour. Units roll 12 dice above half strength and 6 at half or below.'},dr2:{term:'Strength Points',def:'Armour',half:true,note:'Loss = whole hits divided by Armour. Units roll 12 dice above half strength and 6 at half or below.'},pl:{term:'Models',def:'Stamina',half:true,note:'Casualties = whole hits divided by Stamina. Remainders are discarded for each attack.'},generic:{term:'Strength',def:'Defence divisor',half:false,note:'Generic profile: loss = whole hits divided by the defence value.'}};let state={game:'dr1',force:'New Force',units:[]},editId=null,activeId=null,hitCount=0,promptEvent=null;const $=x=>document.getElementById(x),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rem(u){return Math.max(0,u.start-u.lost)}function prof(){return profiles[state.game]}function save(){state.game=$('game').value;state.force=$('force').value||'New Force';localStorage.setItem('ospreyTrackerV1',JSON.stringify(state))}function load(){try{const d=JSON.parse(localStorage.getItem('ospreyTrackerV1'));if(d&&d.units)state=d}catch(e){}$('game').value=state.game;$('force').value=state.force}function status(u){if(rem(u)<=0)return['Destroyed','bad'];if(u.battered)return['Battered','bad'];if(prof().half&&rem(u)<=u.start/2)return['Half strength','half'];return['Ready','']}function dice(u){if(!prof().half)return'—';if(rem(u)<=0)return 0;return rem(u)<=u.start/2?6:12}function render(){const l=$('list');l.innerHTML='';let tr=0,tl=0,tp=0;state.units.forEach(u=>{tr+=rem(u);tl+=u.lost;if(rem(u)>0)tp+=u.pts;const s=status(u),a=document.createElement('article');a.className='card';a.innerHTML=`<div class="unithead"><div><h2>${esc(u.name)}</h2><div class="meta">${esc(u.type||'Unit')} · ${prof().def} ${u.def} · ${u.pts} pts</div></div><span class="badge ${s[1]}">${s[0]}</span></div><div class="grid3"><div class="stat"><b>${rem(u)}/${u.start}</b><span>${prof().term}</span></div><div class="stat"><b>${u.lost}</b><span>Lost</span></div><div class="stat"><b>${dice(u)}</b><span>Combat Dice</span></div></div><div class="actions"><button class="primary damage" data-id="${u.id}">Damage</button><button class="edit" data-id="${u.id}">Edit</button><button class="wide battered" data-id="${u.id}">${u.battered?'Clear Battered':'Mark Battered'}</button><button class="danger delete" data-id="${u.id}">Delete</button></div>`;l.appendChild(a)});$('units').textContent=state.units.length;$('remaining').textContent=tr;$('lost').textContent=tl;$('points').textContent=tp;$('empty').classList.toggle('hidden',state.units.length>0);save()}function updateLabels(){$('defLabel').textContent=prof().def;$('damageDefLabel').textContent='Current '+prof().def;$('profileNote').textContent=prof().note}function openUnit(u){editId=u?.id||null;$('unitTitle').textContent=u?'Edit Unit':'Add Unit';$('name').value=u?.name||'';$('type').value=u?.type||'';$('start').value=u?.start||12;$('def').value=u?.def||(state.game==='pl'?2:3);$('pts').value=u?.pts??4;$('morale').value=u?.morale??4;updateLabels();$('unitDlg').showModal()}function openDamage(id){activeId=id;hitCount=0;const u=state.units.find(x=>x.id===id);$('damageTitle').textContent=u.name;$('currentDef').value=u.def;$('mod').value=0;$('damageDlg').showModal();renderDamage()}function renderDamage(){const u=state.units.find(x=>x.id===activeId),d=Math.max(1,(+$('currentDef').value||1)+(+$('mod').value||0)),loss=Math.min(rem(u),Math.floor(hitCount/d));$('hits').textContent=hitCount;$('preview').textContent=`${hitCount} hits ÷ ${prof().def} ${d} = ${loss} ${prof().term} lost`;$('undo').disabled=!u.history.length}
$('game').onchange=()=>{state.game=$('game').value;updateLabels();render()};$('force').oninput=save;$('add').onclick=()=>openUnit();$('cancel').onclick=()=>$('unitDlg').close();$('unitForm').onsubmit=e=>{e.preventDefault();const data={name:$('name').value.trim(),type:$('type').value.trim(),start:+$('start').value||12,def:+$('def').value||1,pts:+$('pts').value||0,morale:+$('morale').value||0};if(editId){const u=state.units.find(x=>x.id===editId);Object.assign(u,data);u.lost=Math.min(u.lost,u.start)}else state.units.push({id:uid(),...data,lost:0,battered:false,history:[]});$('unitDlg').close();render()};$('list').onclick=e=>{const id=e.target.dataset.id;if(!id)return;const u=state.units.find(x=>x.id===id);if(e.target.classList.contains('damage'))openDamage(id);if(e.target.classList.contains('edit'))openUnit(u);if(e.target.classList.contains('battered')){u.battered=!u.battered;render()}if(e.target.classList.contains('delete')&&confirm('Delete '+u.name+'?')){state.units=state.units.filter(x=>x.id!==id);render()}};$('plus').onclick=()=>{hitCount++;renderDamage()};$('minus').onclick=()=>{hitCount=Math.max(0,hitCount-1);renderDamage()};$('currentDef').oninput=renderDamage;$('mod').oninput=renderDamage;$('applyDamage').onclick=()=>{const u=state.units.find(x=>x.id===activeId),d=Math.max(1,(+$('currentDef').value||1)+(+$('mod').value||0)),loss=Math.min(rem(u),Math.floor(hitCount/d));u.lost+=loss;u.history.push({hits:hitCount,def:d,loss});hitCount=0;render();renderDamage()};$('undo').onclick=()=>{const u=state.units.find(x=>x.id===activeId);if(u.history.length){const h=u.history.pop();u.lost=Math.max(0,u.lost-h.loss);render();renderDamage()}};$('done').onclick=()=>$('damageDlg').close();$('sample').onclick=()=>{if(state.units.length&&!confirm('Replace current force?'))return;if(state.game==='pl')state.units=[['Veteran Pike',12,2,4],['Commanded Shot',12,2,4],['Gallopers',6,2,4]].map(x=>({id:uid(),name:x[0],type:'Sample Unit',start:x[1],def:x[2],pts:x[3],morale:4,lost:0,battered:false,history:[]}));else state.units=[['Elite Foot',6,4,6],['Heavy Foot',12,3,4],['Light Missiles',12,2,4],['Greater Warbeast',6,4,6]].map(x=>({id:uid(),name:x[0],type:'Sample Unit',start:x[1],def:x[2],pts:x[3],morale:4,lost:0,battered:false,history:[]}));render()};$('export').onclick=()=>{save();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='osprey_battle.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.units)throw 0;state=d;$('game').value=state.game;$('force').value=state.force;updateLabels();render()}catch{alert('Invalid export file')}};if(e.target.files[0])r.readAsText(e.target.files[0])};$('reset').onclick=()=>{if(confirm('Reset all damage?')){state.units.forEach(u=>{u.lost=0;u.battered=false;u.history=[]});render()}};$('clear').onclick=()=>{if(confirm('Delete all units?')){state.units=[];render()}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;$('install').hidden=true}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));load();updateLabels();render();
</script></body></html>
